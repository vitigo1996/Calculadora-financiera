name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Necesario para publicar el APK en GitHub Releases
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint and Test
        run: |
          npm run lint
          npm test

      - name: Build Web Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # Firma: si existen los secretos del repositorio (Settings > Secrets and variables > Actions)
      # MISFINANZAS_KEYSTORE_BASE64, MISFINANZAS_KEYSTORE_PASSWORD, MISFINANZAS_KEY_ALIAS y MISFINANZAS_KEY_PASSWORD,
      # se usan esos. Si no, Gradle usa android/app/misfinanzas.keystore + android/keystore.properties del repositorio.
      - name: Restore Signing Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MISFINANZAS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Sin secretos de firma: se usa la clave versionada en el repositorio."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/misfinanzas.keystore"
          echo "MISFINANZAS_KEYSTORE_FILE=$RUNNER_TEMP/misfinanzas.keystore" >> "$GITHUB_ENV"

      - name: Build Signed Release APK and Play Store Bundle (AAB)
        env:
          MISFINANZAS_KEYSTORE_PASSWORD: ${{ secrets.MISFINANZAS_KEYSTORE_PASSWORD }}
          MISFINANZAS_KEY_ALIAS: ${{ secrets.MISFINANZAS_KEY_ALIAS }}
          MISFINANZAS_KEY_PASSWORD: ${{ secrets.MISFINANZAS_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/misfinanzas.keystore"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MisFinanzas-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Play Store Bundle (AAB) to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MisFinanzas-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Publica el APK con un enlace fijo que no cambia entre compilaciones:
      # https://github.com/<repo>/releases/download/apk-latest/MisFinanzas.apk
      - name: Publish APK to GitHub Release (apk-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          cp android/app/build/outputs/apk/release/app-release.apk MisFinanzas.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MisFinanzas.apk \
            --title "MisFinanzas ${VERSION}" \
            --notes "APK firmado de la última versión de main (${GITHUB_SHA::7}). Se instala encima de la app sin perder datos." \
            --target "${GITHUB_SHA}" \
            --latest
